<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3B5BDB"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E9F6E"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E03131"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6875"/></marker></defs><rect width="1120" height="900" fill="#FCFDFF"/><text x="560" y="48" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#16202C">PagedSwipeDeck — how the deck stays full</text><text x="560" y="76" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#5A6875">one buffer, one request in flight, a window that never grows</text><rect x="190" y="116" width="74" height="58" rx="9" fill="#F2F5F9" stroke="#C8D2DE" stroke-width="1.5"/><text x="227.0" y="152" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5A6875">✓</text><rect x="272" y="116" width="74" height="58" rx="9" fill="#F2F5F9" stroke="#C8D2DE" stroke-width="1.5"/><text x="309.0" y="152" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5A6875">✓</text><rect x="354" y="116" width="74" height="58" rx="9" fill="#F2F5F9" stroke="#C8D2DE" stroke-width="1.5"/><text x="391.0" y="152" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5A6875">✓</text><rect x="436" y="116" width="74" height="58" rx="9" fill="#F2F5F9" stroke="#C8D2DE" stroke-width="1.5"/><text x="473.0" y="152" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5A6875">✓</text><rect x="518" y="116" width="74" height="58" rx="9" fill="#EDF1FF" stroke="#3B5BDB" stroke-width="2.2"/><text x="555.0" y="152" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#3B5BDB">TOP</text><rect x="600" y="116" width="74" height="58" rx="9" fill="#FCFDFF" stroke="#B9C6FA" stroke-width="1.5"/><rect x="682" y="116" width="74" height="58" rx="9" fill="#FCFDFF" stroke="#B9C6FA" stroke-width="1.5"/><rect x="764" y="116" width="74" height="58" rx="9" fill="#FCFDFF" stroke="#B9C6FA" stroke-width="1.5"/><rect x="846" y="116" width="74" height="58" rx="9" fill="#FCFDFF" stroke="#B9C6FA" stroke-width="1.5"/><rect x="928" y="116" width="74" height="58" rx="9" fill="#FCFDFF" stroke="#B9C6FA" stroke-width="1.5"/><text x="174" y="146" text-anchor="end" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#16202C">buffer</text><text x="174" y="166" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="500" fill="#5A6875">paginator.items</text><text x="555" y="102" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="500" fill="#3B5BDB">cursor = currentIndex</text><path d="M 190 184 v 9 H 346 v -9" fill="none" stroke="#5A6875" stroke-width="1.5"/><text x="268.0" y="216" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="500" fill="#5A6875">dropped</text><path d="M 354 184 v 9 H 510 v -9" fill="none" stroke="#5A6875" stroke-width="1.5"/><text x="432.0" y="216" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="500" fill="#5A6875">keepBehind</text><path d="M 600 184 v 9 H 1002 v -9" fill="none" stroke="#3B5BDB" stroke-width="1.5"/><text x="801.0" y="216" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="500" fill="#3B5BDB">remaining</text><text x="560" y="262" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5A6875">the front is trimmed once the buffer passes maxBufferedItems — keepBehind cards stay, so undo still works</text><text x="560" y="320" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16.5" font-weight="700" fill="#16202C">every swipe →  _pump()</text><path d="M 560 334 V 358 H 300 V 386" fill="none" stroke="#3B5BDB" stroke-width="2" marker-end="url(#a)"/><path d="M 560 334 V 358 H 820 V 386" fill="none" stroke="#3B5BDB" stroke-width="2" marker-end="url(#a)"/><rect x="65.0" y="384.0" width="470" height="92" rx="14" fill="#F2F5F9" stroke="#C8D2DE" stroke-width="1.5"/><text x="300" y="419.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#16202C">1 · trim   (maxBufferedItems)</text><text x="300" y="441.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5A6875">drop (cursor − keepBehind) from the front</text><text x="300" y="458.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5A6875">paginator.trimLeading + controller.trimLeading</text><rect x="605.0" y="384.0" width="430" height="92" rx="14" fill="#F2F5F9" stroke="#C8D2DE" stroke-width="1.5"/><text x="820" y="419.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#16202C">2 · prefetch   (prefetchThreshold)</text><text x="820" y="441.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5A6875">remaining ≤ threshold ∧ !loading</text><text x="820" y="458.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5A6875">∧ hasMore ∧ !error</text><path d="M 820 476 V 512 H 560 V 546" fill="none" stroke="#3B5BDB" stroke-width="2" marker-end="url(#a)"/><rect x="340.0" y="551.0" width="440" height="70" rx="14" fill="#EDF1FF" stroke="#B9C6FA" stroke-width="1.5"/><text x="560" y="584.2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#16202C">fetcher(page, cursor)</text><text x="560" y="606.8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5A6875">one request in flight at a time</text><path d="M 560 621 V 660 H 205 V 692" fill="none" stroke="#0E9F6E" stroke-width="2" marker-end="url(#g)"/><path d="M 560 621 V 660 H 560 V 692" fill="none" stroke="#5A6875" stroke-width="2" marker-end="url(#m)"/><path d="M 560 621 V 660 H 915 V 692" fill="none" stroke="#E03131" stroke-width="2" marker-end="url(#r)"/><rect x="35.0" y="692.0" width="340" height="112" rx="14" fill="#E9F8F1" stroke="#BFE7D6" stroke-width="1.5"/><text x="205" y="728.2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#16202C">items → append</text><text x="205" y="750.8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5A6875">page++</text><text x="205" y="767.2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5A6875">cursor = nextCursor</text><text x="205" y="783.8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5A6875">keep swiping, no wait</text><rect x="400.0" y="692.0" width="320" height="112" rx="14" fill="#F2F5F9" stroke="#C8D2DE" stroke-width="1.5"/><text x="560" y="728.2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#16202C">done → onEnd() once</text><text x="560" y="750.8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5A6875">empty page</text><text x="560" y="767.2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5A6875">hasMore: false</text><text x="560" y="783.8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5A6875">page &gt; maxPage</text><rect x="745.0" y="692.0" width="340" height="112" rx="14" fill="#FDECEC" stroke="#F5C6C6" stroke-width="1.5"/><text x="915" y="728.2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#E03131">throws → loop pauses</text><text x="915" y="750.8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5A6875">errorBuilder(error, retry)</text><text x="915" y="767.2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5A6875">retry() resumes</text><text x="915" y="783.8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#5A6875">the same page</text><text x="560" y="862" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#5A6875">maxPage, maxBufferedItems and keepBehind are optional — without them the deck pages until the source says it is done.</text></svg>